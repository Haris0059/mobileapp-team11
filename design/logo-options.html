<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline Radar Logos</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:100%/1.5 -apple-system,system-ui,sans-serif;padding:40px 16px 80px;transition:background .3s,color .3s}
header{max-width:1100px;margin:0 auto 32px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05;letter-spacing:-.02em}
header p{color:var(--muted);max-width:60ch}
.toggle{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.toggle:active{transform:scale(.97)}
.grid{max-width:1100px;margin:0 auto;display:grid;gap:24px}
.opt{background:var(--card);border-radius:28px;padding:28px;border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px}
@media (max-width:820px){.opt{grid-template-columns:1fr}}
.opt h2{font-size:1.5rem;letter-spacing:-.01em}
.tag{color:var(--muted);font-size:.95rem;margin:2px 0 20px}
.icons{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.icons figure{text-align:center;font-size:.75rem;color:var(--muted)}
.icon{width:104px;height:104px;border-radius:23px;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.25);margin-bottom:6px}
.icon svg{width:64%;height:64%}
.small .icon{width:58px;height:58px;border-radius:13px}
.pal{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center;font-size:.72rem;color:var(--muted);max-width:460px}
.sw{height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:end;padding:3px 6px;font:600 .62rem ui-monospace,monospace}
.phones{display:flex;gap:16px;flex-wrap:wrap}
.phone{width:190px;height:390px;border-radius:34px;padding:10px;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screen{position:relative;height:100%;border-radius:26px;overflow:hidden;background:var(--pbg);color:var(--ptext);padding:30px 12px 0;font-size:.68rem}
.screen h3{font-size:1.15rem;letter-spacing:-.02em;margin-bottom:8px}
.strip{display:flex;gap:4px;margin-bottom:8px}
.strip span{flex:1;text-align:center;padding:5px 0;border-radius:9px;background:var(--psurf);font-weight:600}
.strip span.on{background:var(--pp);color:var(--pon)}
.c{background:var(--psurf);border-radius:14px;padding:9px 10px;margin-bottom:7px;display:flex;gap:8px;align-items:center}
.c i{width:6px;align-self:stretch;border-radius:3px;background:var(--pp)}
.c small{display:block;opacity:.6}
.nav{position:absolute;left:14px;right:14px;bottom:12px;height:50px;border-radius:25px;display:flex;justify-content:space-around;align-items:center;
  background:var(--glass);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1px solid var(--glassedge);box-shadow:0 6px 20px rgba(0,0,0,.15)}
.nav svg{width:22px;height:22px;color:var(--ptext);opacity:.55}
.nav .on{opacity:1;color:var(--pp)}
.blob{position:absolute;bottom:20px;left:-10px;width:110px;height:60px;border-radius:30px;background:var(--pp);opacity:.5}
.mode{text-align:center;font-size:.72rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header>
  <div><h1>Deadline Radar: logo options</h1>
  <p>Four simple marks, each with one consistent palette. Every option shows its light and dark app icon, its colour tokens, and the home screen with the glass bottom navbar in both modes.</p></div>
  <button class="toggle" id="t">Switch page theme</button>
</header>
<main class="grid" id="g"></main>
<script>
const glyph = {
  radar:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><circle cx="50" cy="50" r="34" opacity=".45"/><circle cx="50" cy="50" r="18" opacity=".75"/><path d="M50 50 L74 26"/><circle cx="74" cy="26" r="7" fill="currentColor" stroke="none"/></svg>`,
  countdown:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><rect x="18" y="24" width="64" height="58" rx="14"/><path d="M34 16v14M66 16v14"/><path d="M50 40v13l9 7"/></svg>`,
  target:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><circle cx="50" cy="54" r="30"/><circle cx="50" cy="54" r="10" fill="currentColor" stroke="none"/><path d="M50 12v14"/></svg>`,
  mono:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M28 20h20a30 30 0 0 1 0 60H28z"/><path d="M46 36v14h12"/></svg>`
};
const navIcons=[
 `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>`,
 `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
 `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>`];
const opts=[
 {name:"1 · Radar",tag:"A radar sweep finding the next deadline. Calm indigo, reads as focused and trustworthy.",g:"radar",
  L:{p:"#4F5BD5",a:"#8A94FF",bg:"#F4F5FB",s:"#FFFFFF",t:"#14162B"},
  D:{p:"#8E97FF",a:"#4A55D0",bg:"#0A0B16",s:"#181A2D",t:"#ECEEFF"}},
 {name:"2 · Countdown",tag:"A calendar with a clock hand: dates and time in one mark. Warm coral, energetic without alarm-red.",g:"countdown",
  L:{p:"#EE5A36",a:"#FFAA8F",bg:"#FBF6F3",s:"#FFFFFF",t:"#26160F"},
  D:{p:"#FF8662",a:"#C24A28",bg:"#110B09",s:"#231815",t:"#FFEDE6"}},
 {name:"3 · Target",tag:"A bullseye with a 12-o'clock tick: hit every deadline. Fresh teal, clear on both backgrounds.",g:"target",
  L:{p:"#0C9A94",a:"#62DDD4",bg:"#F1F8F7",s:"#FFFFFF",t:"#0C2423"},
  D:{p:"#36D3C8",a:"#0B7A75",bg:"#061211",s:"#102120",t:"#E2FAF7"}},
 {name:"4 · Monogram",tag:"A “D” with a clock hand inside. Graphite and lime, the most minimal and neutral.",g:"mono",
  L:{p:"#5E9A0B",a:"#B5EB5A",bg:"#F4F4F1",s:"#FFFFFF",t:"#1C1C1E"},
  D:{p:"#A8E640",a:"#5E8F15",bg:"#09090A",s:"#1C1C1E",t:"#F2F2EE"}}
];
const sw=(c,lbl)=>`<div class="sw" style="background:${c};color:${lbl}">${c}</div>`;
const phone=(P,mode)=>{
 const glass=mode==="Light"?"rgba(255,255,255,.55)":"rgba(40,40,46,.5)";
 const edge=mode==="Light"?"rgba(255,255,255,.7)":"rgba(255,255,255,.12)";
 return `<div><div class="phone"><div class="screen" style="--pbg:${P.bg};--psurf:${P.s};--ptext:${P.t};--pp:${P.p};--pon:${mode==="Light"?"#fff":P.bg};--glass:${glass};--glassedge:${edge}">
  <h3>Today</h3>
  <div class="strip"><span>M<br>16</span><span>T<br>17</span><span class="on">W<br>18</span><span>T<br>19</span><span>F<br>20</span></div>
  <div class="c"><i></i><div><b>DB schema</b><small>IT 3002 · today 23:59</small></div></div>
  <div class="c"><i style="opacity:.6"></i><div><b>Lab 7 kick-off</b><small>IT 3002 · Fri</small></div></div>
  <div class="c"><i style="opacity:.35"></i><div><b>Quiz 3</b><small>Math · Mon</small></div></div>
  <div class="c"><i style="opacity:.2"></i><div><b>Essay draft</b><small>English · 26 Nov</small></div></div>
  <div class="blob"></div>
  <nav class="nav"><span class="on">${navIcons[0]}</span><span>${navIcons[1]}</span><span>${navIcons[2]}</span></nav>
 </div></div><div class="mode">${mode}</div></div>`};
document.getElementById("g").innerHTML=opts.map(o=>`
<section class="opt"><div>
 <h2>${o.name}</h2><p class="tag">${o.tag}</p>
 <div class="icons">
  <figure><div class="icon" style="background:linear-gradient(160deg,${o.L.a},${o.L.p});color:#fff">${glyph[o.g]}</div>Light icon</figure>
  <figure><div class="icon" style="background:linear-gradient(160deg,#2a2a30,#0d0d10);color:${o.D.p}">${glyph[o.g]}</div>Dark icon</figure>
  <figure class="small"><div class="icon" style="background:linear-gradient(160deg,${o.L.a},${o.L.p});color:#fff">${glyph[o.g]}</div>Small</figure>
 </div>
 <div class="pal"><span></span><span>Primary</span><span>Accent</span><span>Background</span><span>Surface</span><span>Text</span>
  <span>Light</span>${sw(o.L.p,"#fff")}${sw(o.L.a,o.L.t)}${sw(o.L.bg,o.L.t)}${sw(o.L.s,o.L.t)}${sw(o.L.t,"#fff")}
  <span>Dark</span>${sw(o.D.p,o.D.bg)}${sw(o.D.a,"#fff")}${sw(o.D.bg,o.D.t)}${sw(o.D.s,o.D.t)}${sw(o.D.t,o.D.bg)}
 </div></div>
 <div class="phones">${phone(o.L,"Light")}${phone(o.D,"Dark")}</div>
</section>`).join("");
document.getElementById("t").onclick=()=>{const r=document.documentElement,d=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=d==="dark"?"light":"dark"};
</script>
</body>
</html>
